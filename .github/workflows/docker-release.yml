name: Docker release

# Builds, smoke-tests and pushes the multi-platform image for a release of this
# repository. Release tags are this repository's versions: v<major>.<minor>.<patch>
# (v2.9.0, v2.9.1, ...).
#
# It runs when a release is published, and can be run by hand for any existing
# release tag. Everything it builds, and the smoke test, comes from the tag.
#
# Run by hand with dry_run, it only builds and smoke-tests the dispatched
# branch on every platform, and prints how long each took: no tag checks, no
# Docker Hub login, no push.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v2.9.0 (leave empty for a dry run)
        required: false
      replace:
        description: Replace the image if this version is already on Docker Hub
        type: boolean
        default: false
      dry_run:
        description: Only build and smoke-test the dispatched branch (no login, no push)
        type: boolean
        default: false

jobs:
  docker:
    runs-on: ubuntu-latest
    # The ARM builds run under QEMU. Stopping below GitHub's six-hour limit
    # makes a run that hangs fail here, with nothing pushed.
    timeout-minutes: 330
    permissions:
      contents: read
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      REPLACE: ${{ inputs.replace || false }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
        with:
          # A dry run builds the dispatched branch, a release its tag
          ref: ${{ inputs.dry_run && github.ref || env.TAG }}
          # All tags, to find the newest release.
          fetch-depth: 0
      -
        name: Check the compose file
        run: ./.github/compose-check.sh docker-compose.yml
      -
        uses: docker/setup-qemu-action@v4
      -
        uses: docker/setup-buildx-action@v4
      -
        # Checks the tag and works out the image version and tags
        name: Versions
        if: inputs.dry_run != true
        run: ./.github/release-versions.sh "$TAG" >> "$GITHUB_ENV"
      -
        uses: docker/login-action@v4
        if: inputs.dry_run != true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Check the version is new
        if: inputs.dry_run != true
        run: |
          IMAGE=$(docker buildx bake -f docker-bake.hcl --print | jq -r '.target.basicstation.tags[0]')
          ./.github/release-is-new.sh "$IMAGE" "$REPLACE"
      -
        # Each platform is built into the local Docker and tested before
        # anything is pushed. One platform that hangs is stopped after 100
        # minutes, which fails the job: the other platforms and the push don't
        # run. The push below then reuses these builds from the builder's cache.
        name: Smoke test
        run: |
          # The NIC checks use a dummy interface when the module is there
          sudo modprobe dummy || true
          TOTAL=$SECONDS
          for platform in linux/amd64 linux/arm64 linux/arm/v7; do
            STARTED=$SECONDS
            timeout 100m bash -c '
              docker buildx bake -f docker-bake.hcl --load --set "*.platform=$1" \
                --set "basicstation.tags=smoke:basicstation"
              ./smoke-test.sh smoke:basicstation "$1"' _ "$platform"
            echo "$platform: build and smoke test took $(( (SECONDS - STARTED) / 60 )) min"
          done
          echo "All platforms: $(( (SECONDS - TOTAL) / 60 )) min"
      -
        # The reset script's timing with the image's real gpioset, on a
        # simulated GPIO chip. Only on amd64: qemu-user does not translate the
        # GPIO ioctls. Runners whose kernel lacks gpio-sim skip it with a
        # notice; the hardware checks before a release still cover it.
        name: GPIO timing (amd64)
        run: |
          if sudo modprobe gpio-sim; then
            docker buildx bake -f docker-bake.hcl --load --set "*.platform=linux/amd64" \
              --set "basicstation.tags=smoke:gpio-sim"
            ./smoke/gpio-sim-check.sh smoke:gpio-sim
          else
            echo "::notice::GPIO timing check skipped: this runner cannot load the gpio-sim kernel module"
          fi
      -
        name: Build and push
        if: inputs.dry_run != true
        run: docker buildx bake -f docker-bake.hcl --push --progress=plain
